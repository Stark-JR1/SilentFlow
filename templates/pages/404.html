<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><title>404 — FinTrack Pro</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0f14;--text:#e8eaf0;--text2:#8890a4;--accent:#6c63ff;--accent2:#8b83ff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
    h1{font-size:80px;font-weight:700;color:var(--accent);margin-bottom:8px}
    p{color:var(--text2);margin-bottom:24px}
    a{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:500}
    a:hover{background:var(--accent2)}
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <div style="font-size:18px;font-weight:600;margin-bottom:8px">Página não encontrada</div>
    <p>A página que você procura não existe ou foi movida.</p>
    <a href="/dashboard">← Voltar ao Dashboard</a>
  </div>
</body>
</html>
